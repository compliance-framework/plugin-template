name: cut-prerelease
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cut:
    # Skipped while this is a template repo (plugin-template never releases); runs in repos created from it.
    if: ${{ !github.event.repository.is_template }}
    uses: compliance-framework/workflows/.github/workflows/cut-prerelease.yml@6e7fc9c04b59c7d1117938da397f8a6f8df036ab # v1.5.2
    permissions:
      contents: read
    secrets: inherit
