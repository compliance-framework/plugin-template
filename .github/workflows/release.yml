# Publishes the plugin (goreleaser archives + gooci upload) when a release is published.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    # Skipped while this is a template repo (plugin-template never releases); runs in repos created from it.
    if: ${{ !github.event.repository.is_template }}
    uses: compliance-framework/workflows/.github/workflows/release-go-plugin.yml@6e7fc9c04b59c7d1117938da397f8a6f8df036ab # v1.5.2
    with:
      protocol-version: "2"
    permissions:
      contents: write # goreleaser attaches the archives to the release
      packages: write
    secrets: inherit
